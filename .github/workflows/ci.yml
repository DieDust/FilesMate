name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run non-performance tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release
      - name: Verify bounded PDF page layout
        run: node scripts/test-pdf-window.mjs
      - name: Verify resource bounds and directory lifecycle
        shell: pwsh
        run: ./scripts/run-perf.ps1 -NoBuild -Repetitions 1 -OutputDirectory artifacts/test-results/resources
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
          retention-days: 7
